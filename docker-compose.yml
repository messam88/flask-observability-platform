  product_service:
    build: ./product_service
    container_name: product_service
    ports:
      - "5001:5000"
    labels:
      job: product_service
    logging:
      driver: "json-file"
    depends_on:
      - mongo
    volumes:
      - ./logs/product_service:/logs/product_service

  service_a:
    build: ./service_a
    container_name: service_a
    ports:
      - "5002:5000"
    labels:
      job: service_a
    logging:
      driver: "json-file"
    volumes:
      - ./logs/service_a:/logs/service_a

  service_b:
    build: ./service_b
    container_name: service_b
    ports:
      - "5003:5000"
    labels:
      job: service_b
    logging:
      driver: "json-file"
    volumes:
      - ./logs/service_b:/logs/service_b

  # postgres:
  #   image: postgres:15
  #   container_name: postgres
