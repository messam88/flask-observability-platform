server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: service_a_file
    static_configs:
      - targets:
          - localhost
        labels:
          job: service_a
          __path__: /logs/service_a/app.log*
    pipeline_stages:
      - json:
          expressions:
            level: level
            trace_id: trace_id
            service: service
            message: message
      - labels:
          level: ""
          service: ""

  - job_name: service_b_file
    static_configs:
      - targets:
          - localhost
        labels:
          job: service_b
          __path__: /logs/service_b/app.log*
    pipeline_stages:
      - json:
          expressions:
            level: level
            trace_id: trace_id
            service: service
            message: message
      - labels:
          level: ""
          service: ""

  - job_name: user_service_file
    static_configs:
      - targets:
          - localhost
        labels:
          job: user_service
          __path__: /logs/user_service/app.log*
    pipeline_stages:
      - json:
          expressions:
            level: level
            trace_id: trace_id
            service: service
            message: message
      - labels:
          level: ""
          service: ""
